plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

// Per-flavor version overrides. Each brand ships to its own store listing and
// advances its own release history, so its version must not be tied to the others.
// Set brand.versionName / brand.versionCode in local.properties to bump one flavor
// independently; falls back to the shared flutter.versionName/versionCode otherwise.
def getgabsVersionName = localProperties.getProperty("getgabs.versionName") ?: flutterVersionName
def getgabsVersionCode = (localProperties.getProperty("getgabs.versionCode") ?: flutterVersionCode).toInteger()
def messagedlyVersionName = localProperties.getProperty("messagedly.versionName") ?: flutterVersionName
def messagedlyVersionCode = (localProperties.getProperty("messagedly.versionCode") ?: flutterVersionCode).toInteger()
def scalewizVersionName = localProperties.getProperty("scalewiz.versionName") ?: flutterVersionName
def scalewizVersionCode = (localProperties.getProperty("scalewiz.versionCode") ?: flutterVersionCode).toInteger()

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {

    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    namespace = "com.getgabs.getgabs"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // sourceCompatibility = JavaVersion.VERSION_1_8
        // targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "17"
        // jvmTarget = "1.8"
    }
    
    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        // applicationId = "com.getgabs.getgabs"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = 24
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        multiDexEnabled true
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }
flavorDimensions = ["brand"]

    productFlavors {
        getgabs {
            dimension = "brand"
            applicationId = "com.getgabs.getgabs"
            resValue "string", "app_name", "GetGabs"
            versionName = getgabsVersionName
            versionCode = getgabsVersionCode
        }
        messagedly {
                dimension = "brand"
                applicationId = "com.messagedly.messagedly"
                resValue "string", "app_name", "Messagedly"
                versionName = messagedlyVersionName
                versionCode = messagedlyVersionCode
        }
        scalewiz{
            dimension = "brand"
            applicationId = "com.scalewiz.scalewiz"
            resValue "string", "app_name", "Scalewiz"
            versionName = scalewizVersionName
            versionCode = scalewizVersionCode
        }
    }
    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }
    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now,
            // so `flutter run --release` works.
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.15.0"
        force "androidx.core:core-ktx:1.15.0"
    }
}
dependencies {
    // For AGP 7.4+
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    // For AGP 7.4+
    // coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // For AGP 7.3
    // coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.3'
    // For AGP 4.0 to 7.2
    // coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.1.9'
}
flutter {
    source = "../.."
}
